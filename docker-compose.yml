version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: recruitment-rabbitmq
    ports:
      - "5672:5672"     
      - "15672:15672"  
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - recruitment-network

  auth-db:
    image: mysql:8.0
    container_name: auth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_service_db
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - recruitment-network

  application-db:
    image: mysql:8.0
    container_name: application-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: application_service_db 
    ports:
      - "3308:3306"
    volumes:
      - application_db_data:/var/lib/mysql
    networks:
      - recruitment-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6380:6379" 
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - recruitment-network

  matching-service:
    build:
      context: ./matching-service       
      dockerfile: Dockerfile
    container_name: matching-service
    ports:
      - "8000:8000"
    restart: always
    networks:
      - recruitment-network

  application-service:
    build: 
      context: ./application-service
      dockerfile: Dockerfile
    container_name: application-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=application-mysql
      - DB_PORT=3306 
      - DB_USER=root
      - DB_PASS=root
      - RABBITMQ_HOST=recruitment-rabbitmq
      - RABBITMQ_PORT=5672
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - application-db
      - rabbitmq
    networks:
      - recruitment-network

volumes:
  rabbitmq_data:
  redis_data:
  auth_db_data:
  job_db_data:
  application_db_data:

networks:
  recruitment-network:
    driver: bridge