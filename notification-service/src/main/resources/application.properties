spring.application.name=notification-service
server.port=8086
spring.cloud.compatibility-verifier.enabled=false

spring.data.mongodb.uri=${MONGODB_URI:your_default_mongodb_uri}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}


url.front-end=${URL_FE:http://localhost:5173/}


spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${EMAIL_SEND:your_email_send}
spring.mail.password=${EMAIL_APP_PASSWORD:your_default_app_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8