spring.application.name=job-service
server.port=8082
spring.cloud.compatibility-verifier.enabled=false

spring.data.mongodb.uri=${MONGODB_URI:your_default_mongodb_uri}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=


cv.jd.service.url=${BASE_URL_MATCHING_SERVICE}