spring.application.name=blog-service
server.port=8085
spring.cloud.compatibility-verifier.enabled=false

spring.mongodb.uri=${MONGODB_URI:your_default_mongodb_uri}
spring.data.mongodb.auto-index-creation=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_default_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_default_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_default_api_secret}