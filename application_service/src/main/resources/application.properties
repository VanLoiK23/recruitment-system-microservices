spring.application.name=application-service
server.port=8083
spring.cloud.compatibility-verifier.enabled=false

# Config connect DB
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/application_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.security=DEBUG

# Config Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Turn on log for debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.results.loading=trace

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_default_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_default_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_default_api_secret}

gemini.api.key=${GOOGLE_API_KEY:your_default_key_api}
gemini.model=gemini-2.5-flash

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}